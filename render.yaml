# Render Deployment Blueprint
# Deploy both Backend API and Frontend Static Site with one click

services:
  # 1. Backend Web Service (Node.js + Express + Prisma + Socket.IO)
  - type: web
    name: collaborative-kanban-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_zs8nLuXN5ZqC@ep-tiny-lake-b43jtqal-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: collaborative-kanban-client
          property: host

  # 2. Frontend Static Site (React + Vite + Tailwind + dnd-kit)
  - type: web
    name: collaborative-kanban-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: collaborative-kanban-api
          envVarKey: RENDER_EXTERNAL_URL
          transform: "${RENDER_EXTERNAL_URL}/api"
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: collaborative-kanban-api
          envVarKey: RENDER_EXTERNAL_URL
